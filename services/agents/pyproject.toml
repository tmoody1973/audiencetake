[project]
name = "audience-take-agents"
version = "0.1.0"
description = "Google ADK research service for Audience Take"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116.0",
  # Keep structured-output schema behavior reproducible across smoke revisions.
  "google-adk==2.7.1",
  "google-genai==2.20.0",
  "google-cloud-firestore>=2.21.0",
  "jsonschema>=4.25.0",
  "pydantic==2.13.4",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audience_take_agents"]

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["audience_take_agents"]
